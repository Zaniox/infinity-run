<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>// SOUNDRISE : INFINITY RUN</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Importmap Three.js moderne sans build step / 100% compatible GitHub Pages -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay Minimaliste : Infi vs Nity -->
    <div id="hud-overlay">
      <header class="hud-header">
        <div class="hud-brand">
          <h1 class="hud-title">// SOUNDRISE <span class="neon-nity">: INFINITY RUN</span></h1>
          <div class="hud-subtitle">CYCLE 1 &bull; INFI EN VOL VERS NITY</div>
        </div>

        <div class="hud-target-badge">
          <div class="target-dot"></div>
          <span class="target-text">CIBLE : NITY (HORIZON)</span>
        </div>
      </header>

      <footer class="hud-footer">
        <div class="hud-controls-hint">
          <span class="key-hint">◄</span> <span class="key-hint">►</span> ou <span class="key-hint">Q</span> / <span class="key-hint">D</span> Virage &bull; Glisser Souris / Tactile
        </div>
      </footer>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
